_ > nanoagent.plugin.v0001.ManifestConfig:
id: av-sudoku-solver
name: Sudoku Solver
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_puzzle:
    description: Show a sudoku puzzle by its id as nine rows of digits and dots
  analyze_grid:
    description: For a grid, list each empty cell's remaining options and any row, column or box that repeats a digit
  puzzle_record:
    description: The puzzle itself, pinned as the verifier's reference

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  get-puzzle:
    description: Show a sudoku puzzle
    runner: tool
    tools: [get_puzzle]
    reference: null
    instructions: Return the sudoku puzzle with this id.
  solve-sudoku:
    description: Solve a sudoku, or show that it has no solution
    runner: agent
    tools: [get_puzzle, analyze_grid]
    reference: puzzle_record
    instructions: |-
      Read the puzzle with get_puzzle: nine rows of nine cells, a digit 1 to 9 or . for empty. Fill every empty cell so that each row, column and 3x3 box holds 1 to 9 once, keeping every given digit; or decide that the puzzle has no solution.
      analyze_grid shows each empty cell's remaining options and any conflicts for a grid you pass it, so you can fill cells, check, and continue.
      You have a budget of 12 tool calls in all, get_puzzle included; after that every tool fails. Fill as many cells as you can by reasoning between calls.
      Submit solvable and the solved grid as nine rows of nine digits, or solvable false with an empty solution.
      Every reply must be a tool call: never answer with text alone, or the run ends with nothing submitted. When you are done, stuck, or near the end of your budget, call submit. Set gave_up to false when you believe your answer is right; if you could not solve it, set gave_up to true and submit your best attempt, or empty values.
